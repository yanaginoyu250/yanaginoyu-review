<style>
:root{
  --paper:#f6f1e7;
  --card:#fffdf8;
  --ink:#2a2520;
  --ink-soft:#5e554b;
  --line:#e2d8c6;
  --yanagi:#5d6f34;      /* 柳色 */
  --accent:#8a3b2e;      /* 弁柄 */
  --focus:#c9a227;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Songti TC","PMingLiU",serif;
  font-size:18px;line-height:1.8;
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}

/* 言語切替 */
.lang{display:flex;justify-content:flex-end;gap:6px;padding:12px 0 0}
.lang button{
  font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer
}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ヘッダー */
header{text-align:center;padding:28px 0 8px}
.sub{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.2em;font-size:15px;color:var(--ink-soft);margin:0}
h1{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:600;font-size:40px;letter-spacing:.15em;margin:4px 0 0;line-height:1.3}
.rule{width:48px;height:2px;background:var(--yanagi);margin:18px auto}
.lead{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-size:20px;font-weight:500;margin:0 0 10px;white-space:pre-line}
h2,.box h3{text-wrap:balance}
.intro{color:var(--ink-soft);margin:0;text-align:left}

/* 質問と選択肢 */
h2{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-size:22px;text-align:center;margin:36px 0 16px}
.choices{display:grid;gap:12px}
.choice{
  display:flex;align-items:center;gap:14px;width:100%;min-height:72px;
  padding:14px 18px;border-radius:14px;border:2px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer;
  transition:border-color .15s, box-shadow .15s;
}
.choice:hover{border-color:var(--yanagi)}
.choice:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.choice[aria-expanded="true"]{border-color:var(--yanagi);border-bottom-width:0;padding-bottom:16px;border-radius:14px 14px 0 0;background:var(--card)}
.choice .name{font-size:20px;font-weight:600;display:block;line-height:1.4}
.choice .hint{font-size:15px;color:var(--ink-soft);display:block;line-height:1.5}
.choice .chev{margin-left:auto;font-size:22px;color:var(--yanagi);transition:transform .2s}
.choice[aria-expanded="true"] .chev{transform:rotate(90deg)}
.dot{width:14px;height:14px;border-radius:50%;flex:none}

/* 手順パネル */
.panel{
  background:var(--card);border:2px solid var(--yanagi);border-top:none;
  border-radius:0 0 14px 14px;margin:-12px 0 0;padding:4px 18px 20px;
}
.panel[hidden]{display:none}
.panel::before{content:"";display:block;border-top:1px solid var(--line);margin:0 0 18px}
.steps{list-style:none;margin:0 0 18px;padding:0;counter-reset:s}
.steps li{position:relative;padding:0 0 12px 46px;counter-increment:s}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:2px;width:32px;height:32px;border-radius:50%;
  background:var(--yanagi);color:#fff;font-weight:600;display:grid;place-items:center;font-size:17px;line-height:1
}
.go{
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;
  border-radius:12px;background:var(--yanagi);color:#fff;text-decoration:none;
  font-size:19px;font-weight:600;padding:12px 16px;text-align:center
}
.go:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.go.secondary{background:transparent;color:var(--yanagi);border:2px solid var(--yanagi);margin-top:10px}
.note{font-size:15px;color:var(--ink-soft);margin:14px 0 0;line-height:1.7}

/* ご家族向け・お困りごと */
.box{border-radius:14px;padding:20px 18px;margin-top:28px}
.box h3{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-size:19px;margin:0 0 8px}
.box p{margin:0 0 14px}
.family{background:#efe7d6}
.share{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.share a,.share button{
  font:inherit;font-size:16px;font-weight:600;min-height:52px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;padding:8px
}
.line{background:#06c755;color:#fff;border:none}
.copy{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.help{background:var(--card);border:1px solid var(--line)}
.tel{display:inline-flex;align-items:center;gap:8px;font-size:22px;font-weight:600;color:var(--accent);text-decoration:none}

footer{text-align:center;margin-top:36px;font-size:15px;color:var(--ink-soft)}
footer a{color:var(--yanagi);font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

html[lang="zh-Hant"] body{font-family:"Shippori Mincho","Songti TC","PMingLiU","Noto Serif TC",serif}
@media (max-width:360px){h1{font-size:34px}.share{grid-template-columns:1fr}}
.logo{margin:8px 0 0;line-height:0}
.logo img{width:96px;height:auto}
</style>
</head>

// 公開用のURL（計測用の ?src=... は除き、予約サイトの指定 ?site=... は残してご家族に共有）
const siteParam = new URLSearchParams(location.search).get("site");
const shareUrl = location.origin + location.pathname + (siteParam ? "?site=" + encodeURIComponent(siteParam) : "");

function setLang(lang){
  if(!T[lang]) lang = "ja";
  const d = T[lang];
  document.documentElement.lang = lang;
  document.title = d.title;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if(d[k] != null) el.textContent = d[k];
  });
  document.querySelectorAll("[data-set-lang]").forEach(b=>{
    b.setAttribute("aria-pressed", String(b.dataset.setLang === lang));
  });
  const LL = {
    ja:{ booking:"https://secure.booking.com/mytrips.ja.html", agoda:"https://www.agoda.com/ja-jp/account/bookings.html", expedia:"https://www.expedia.co.jp/trips" },
    en:{ booking:"https://secure.booking.com/mytrips.en-gb.html", agoda:"https://www.agoda.com/en-us/account/bookings.html", expedia:"https://www.expedia.com/trips" },
    "zh-Hant":{ booking:"https://secure.booking.com/mytrips.zh-tw.html", agoda:"https://www.agoda.com/zh-tw/account/bookings.html", expedia:"https://www.expedia.com.tw/trips" }
  }[lang];
  document.querySelectorAll('[data-link="booking"]').forEach(a=>a.href = LL.booking);
  document.querySelectorAll('[data-link="agoda"]').forEach(a=>a.href = LL.agoda);
  document.querySelectorAll('[data-link="expedia"]').forEach(a=>a.href = LL.expedia);
  document.getElementById("lineShare").href =
    "https://line.me/R/msg/text/?" + encodeURIComponent(d.shareText + "\n" + shareUrl);
  try{ localStorage.setItem("yny-lang", lang); }catch(e){}
}

// リンクの設定
document.querySelectorAll("[data-link]").forEach(a=>{ a.href = CONFIG[a.dataset.link]; });
document.getElementById("telLink").href = "tel:" + CONFIG.tel.replace(/-/g,"");
document.getElementById("telText").textContent = CONFIG.tel;

// 選択肢の開閉（ひとつだけ開く）
document.querySelectorAll(".choice").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const open = btn.getAttribute("aria-expanded") === "true";
    document.querySelectorAll(".choice").forEach(b=>{
      b.setAttribute("aria-expanded","false");
      document.getElementById(b.getAttribute("aria-controls")).hidden = true;
    });
    if(!open){
      btn.setAttribute("aria-expanded","true");
      const p = document.getElementById(btn.getAttribute("aria-controls"));
      p.hidden = false;
      btn.scrollIntoView({behavior:"smooth", block:"start"});
    }
  });
});

// リンクのコピー
document.getElementById("copyBtn").addEventListener("click", async ()=>{
  const lang = document.documentElement.lang;
  try{ await navigator.clipboard.writeText(shareUrl); }
  catch(e){
    const t = document.createElement("textarea"); t.value = shareUrl; document.body.appendChild(t);
    t.select(); try{ document.execCommand("copy"); }catch(_){} t.remove();
  }
  const toast = document.getElementById("toast");
  toast.textContent = T[lang].copied; toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"), 1800);
});

document.querySelectorAll("[data-set-lang]").forEach(b=>b.addEventListener("click", ()=>setLang(b.dataset.setLang)));

// 予約サイトの指定（しおりのQR用）：?site=jalan / rakuten / google / intl
// 指定されたサイトの手順を一番上に移して、最初から開いておく
(function(){
  const map = { jalan:"jalan", rakuten:"rakuten", ikyu:"ikyu", booking:"booking", agoda:"agoda", expedia:"expedia",
                google:"direct", direct:"direct", intl:"intl" };
  const key = map[(new URLSearchParams(location.search).get("site") || "").toLowerCase()];
  if(!key) return;
  const btn = document.querySelector(`.choice[data-key="${key}"]`);
  const panel = document.getElementById(btn.getAttribute("aria-controls"));
  const wrap = document.querySelector(".choices");
  wrap.prepend(panel); wrap.prepend(btn);
  btn.setAttribute("aria-expanded","true");
  panel.hidden = false;
})();

// 初期言語：?lang=en などの指定 → 前回の選択 → 端末の言語
(function(){
  const q = new URLSearchParams(location.search).get("lang");
  let saved = null; try{ saved = localStorage.getItem("yny-lang"); }catch(e){}
  const nav = (navigator.language || "ja").toLowerCase();
  const guess = nav.startsWith("ja") ? "ja" : nav.startsWith("zh") ? "zh-Hant" : "en";
  setLang(q || saved || guess);
})();
</script>
